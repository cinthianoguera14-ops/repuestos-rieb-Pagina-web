<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar | Repuestos Rieb</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="py-3">
    <nav class="container d-flex justify-content-between align-items-center">
        <a href="index.html">
            <img src="multimedia/logo-rieb.jpg" alt="Logo Repuestos Rieb" style="height:75px;">
        </a>
        <a href="index.html" class="btn btn-outline-primary">Volver al inicio</a>
    </nav>
</header>

<main class="container py-5">
    <section class="acceso-card text-center mx-auto" style="max-width:550px;">

        <div class="acceso-icono mx-auto mb-3">
            <i class="bi bi-lock-fill"></i>
        </div>

        <h1>Acceso al catálogo</h1>

        <p>
            Ingresá con tu cuenta de Google para consultar
            nuestro catálogo exclusivo de productos.
        </p>

        <button id="btnGoogle" class="btn btn-primary btn-lg">
            <i class="bi bi-google me-2"></i>
            Ingresar con Google
        </button>

        <p id="mensajeLogin" class="mt-3"></p>

    </section>
</main>

<footer class="text-center py-4">
    <p>Repuestos Rieb · Respuestas rápidas, soluciones en marcha</p>
    <p>Proyecto desarrollado por Cinthia Noguera · CEAER</p>
</footer>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<script type="module">
    import {
        iniciarSesionGoogle,
        observarSesion
    } from "./js/auth.js";

    const boton = document.getElementById("btnGoogle");
    const mensaje = document.getElementById("mensajeLogin");

    boton.addEventListener("click", async () => {
        mensaje.textContent = "Conectando con Google...";
        boton.disabled = true;

        const usuario = await iniciarSesionGoogle();

        if (usuario) {
            window.location.href = "productos.html";
        } else {
            mensaje.textContent = "No se pudo iniciar sesión. Intentá nuevamente.";
            boton.disabled = false;
        }
    });

    observarSesion((usuario) => {
        if (usuario) {
            window.location.href = "productos.html";
        }
    });
</script>

</body>
</html>
